name: Build Extension Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - beta

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(grep -m1 '^version' backend/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match backend/Cargo.toml version $CARGO — refusing to release a mislabeled artifact"
            exit 1
          fi

      - name: Build .c7s.zip
        run: zip -r gg_ir77_mcversionchooser.c7s.zip Metadata.toml frontend/ backend/ migrations/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gg_ir77_mcversionchooser.c7s.zip
          generate_release_notes: true

      - name: Upload Beta Artifact
        if: github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: gg_ir77_mcversionchooser-beta
          path: gg_ir77_mcversionchooser.c7s.zip
